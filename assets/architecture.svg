<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 420" width="1120" height="420" role="img" aria-label="Traffic Intelligence Platform request pipeline: a planning question in Arabic or English goes to a planner, which dispatches routing, corridor and name-resolution agents. Each agent reads a verified data source — PostGIS and pgRouting with 135k edges and 99k vertices, a corridor registry, and an Arabic street-name index. Their results form an evidence set, which a critic gates: claims backed by evidence return an answer with its evidence, unsupported claims return a refusal naming the missing evidence.">
  <title>Traffic Intelligence Platform — evidence-gated request pipeline</title>
  <defs>
    <linearGradient id="abg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06111C"/><stop offset="50%" stop-color="#0A1B2E"/><stop offset="100%" stop-color="#0B2842"/>
    </linearGradient>
    <pattern id="adots" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="1.4" cy="1.4" r="1.4" fill="#2F7FD6" fill-opacity="0.10"/>
    </pattern>
    <filter id="aglow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#3B6E9E"/>
    </marker>
  </defs>

  <rect width="1120" height="420" rx="14" fill="url(#abg)"/>
  <rect width="1120" height="420" rx="14" fill="url(#adots)"/>

  <text x="28" y="40" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="14" letter-spacing="2.2" fill="#5E90CC">REQUEST PIPELINE</text>
  <text x="1092" y="40" text-anchor="end" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="14" letter-spacing="2.2" fill="#B45309">EVIDENCE-GATED</text>
  <rect x="28" y="52" width="1064" height="1" fill="#1B4B7A"/>

  <text x="392" y="98" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="13" letter-spacing="2" fill="#4E7BA8">AGENTS</text>
  <text x="574" y="98" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="13" letter-spacing="2" fill="#4E7BA8">VERIFIED DATA</text>

  <!-- connectors -->
  <g stroke="#3B6E9E" stroke-width="1.6" fill="none" marker-end="url(#ah)">
    <path d="M154,230 L176,230"/>
    <path d="M294,230 C310,230 306,150 320,150"/>
    <path d="M294,230 L320,230"/>
    <path d="M294,230 C310,230 306,310 320,310"/>
    <path d="M462,150 L488,150"/><path d="M462,230 L488,230"/><path d="M462,310 L488,310"/>
    <path d="M658,150 C676,150 672,230 684,230"/>
    <path d="M658,230 L684,230"/>
    <path d="M658,310 C676,310 672,230 684,230"/>
    <path d="M810,230 L818,230"/>
    <path d="M912,230 C928,230 924,186 936,186"/>
    <path d="M912,230 C928,230 924,282 936,282"/>
  </g>

  <!-- 1 question -->
  <rect x="20" y="190" width="134" height="80" rx="9" fill="#33506B" stroke="#5B7C9E" stroke-width="1.4"/>
  <text x="87" y="223" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#EAF2FB">Planning</text>
  <text x="87" y="245" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#EAF2FB">question</text>
  <text x="87" y="264" text-anchor="middle" font-family="SFMono-Regular, Menlo, monospace" font-size="12" fill="#A9C2DA">AR / EN</text>

  <!-- 2 planner -->
  <rect x="176" y="190" width="118" height="80" rx="9" fill="#1F6FEB" stroke="#5AA6FF" stroke-width="1.4"/>
  <text x="235" y="228" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#FFFFFF">Planner</text>
  <text x="235" y="249" text-anchor="middle" font-family="SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#CFE3FF">decompose</text>

  <!-- 3 agents -->
  <g fill="#1F6FEB" stroke="#5AA6FF" stroke-width="1.4">
    <rect x="320" y="120" width="142" height="60" rx="9"/>
    <rect x="320" y="200" width="142" height="60" rx="9"/>
    <rect x="320" y="280" width="142" height="60" rx="9"/>
  </g>
  <g text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#FFFFFF">
    <text x="391" y="156">Routing</text><text x="391" y="236">Corridor</text><text x="391" y="316">Name resolution</text>
  </g>

  <!-- 4 verified data -->
  <g fill="#0E7490" stroke="#3FA9C4" stroke-width="1.4">
    <rect x="488" y="120" width="170" height="60" rx="9"/>
    <rect x="488" y="200" width="170" height="60" rx="9"/>
    <rect x="488" y="280" width="170" height="60" rx="9"/>
  </g>
  <g text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" fill="#FFFFFF">
    <text x="573" y="146" font-size="16" font-weight="600">PostGIS · pgRouting</text>
    <text x="573" y="166" font-size="11" fill="#C4E9F2" font-family="SFMono-Regular, Menlo, monospace">135k edges · 99k vertices</text>
    <text x="573" y="236" font-size="16" font-weight="600">Corridor registry</text>
    <text x="573" y="310" font-size="16" font-weight="600">Arabic street-name</text>
    <text x="573" y="330" font-size="16" font-weight="600">index</text>
  </g>

  <!-- 5 evidence -->
  <rect x="684" y="190" width="126" height="80" rx="9" fill="#0A66C2" stroke="#5AA6FF" stroke-width="1.4"/>
  <text x="747" y="228" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#FFFFFF">Evidence</text>
  <text x="747" y="249" text-anchor="middle" font-family="SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#CFE3FF">collected</text>

  <!-- 6 critic -->
  <g transform="translate(865,230)">
    <rect x="-46" y="-46" width="92" height="92" rx="10" transform="rotate(45)" fill="#B45309" stroke="#E8A24C" stroke-width="1.6"/>
  </g>
  <text x="865" y="236" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">Critic</text>

  <!-- 7 outcomes -->
  <rect x="936" y="152" width="168" height="68" rx="9" fill="#15803D" stroke="#4ADE80" stroke-width="1.4"/>
  <text x="1020" y="180" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#FFFFFF">Answer</text>
  <text x="1020" y="201" text-anchor="middle" font-family="SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#CFF3DC">with its evidence</text>
  <rect x="936" y="152" width="168" height="68" rx="9" fill="none" stroke="#4ADE80" stroke-width="2.4" opacity="0">
    <animate attributeName="opacity" values="0;0;0.95;0;0" keyTimes="0;0.38;0.44;0.52;1" dur="8s" repeatCount="indefinite"/>
  </rect>

  <rect x="936" y="248" width="168" height="68" rx="9" fill="#9F1239" stroke="#FB7185" stroke-width="1.4"/>
  <text x="1020" y="276" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#FFFFFF">Refuse</text>
  <text x="1020" y="297" text-anchor="middle" font-family="SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#FFD7DE">name what is missing</text>
  <rect x="936" y="248" width="168" height="68" rx="9" fill="none" stroke="#FB7185" stroke-width="2.4" opacity="0">
    <animate attributeName="opacity" values="0;0;0.95;0;0" keyTimes="0;0.88;0.94;1;1" dur="8s" repeatCount="indefinite"/>
  </rect>

  <!-- packet: backed path (via top lane) -->
  <circle r="4.2" fill="#8FC4FF" filter="url(#aglow)">
    <animateMotion dur="8s" repeatCount="indefinite" calcMode="linear" keyPoints="0;1;1" keyTimes="0;0.45;1"
      path="M87,230 L238,230 L392,150 L574,150 L748,230 L866,230 L1021,186"/>
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.03;0.42;0.46;1" dur="8s" repeatCount="indefinite"/>
  </circle>
  <!-- packet: unsupported path (via bottom lane) -->
  <circle r="4.2" fill="#F0A868" filter="url(#aglow)">
    <animateMotion dur="8s" begin="4s" repeatCount="indefinite" calcMode="linear" keyPoints="0;1;1" keyTimes="0;0.45;1"
      path="M87,230 L238,230 L392,310 L574,310 L748,230 L866,230 L1021,282"/>
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.03;0.42;0.46;1" dur="8s" begin="4s" repeatCount="indefinite"/>
  </circle>

  <text x="28" y="398" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#4E7BA8">No claim leaves the system without evidence behind it.</text>
</svg>
