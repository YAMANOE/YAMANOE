<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" width="1200" height="120" role="img" aria-label="Yaman Obiedat — Amman, Jordan. Arabic and English.">
  <defs>
    <linearGradient id="fbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06111C"/><stop offset="50%" stop-color="#0A1B2E"/><stop offset="100%" stop-color="#0B2842"/>
    </linearGradient>
    <linearGradient id="fedge" gradientUnits="userSpaceOnUse" x1="48" y1="86" x2="1152" y2="86">
      <stop offset="0%" stop-color="#2F7FD6" stop-opacity="0"/>
      <stop offset="12%" stop-color="#2F7FD6" stop-opacity="0.95"/>
      <stop offset="88%" stop-color="#2F7FD6" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#2F7FD6" stop-opacity="0"/>
    </linearGradient>
    <pattern id="fdots" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="1.4" cy="1.4" r="1.4" fill="#2F7FD6" fill-opacity="0.10"/>
    </pattern>
    <filter id="fgl" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="3.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="120" rx="14" fill="url(#fbg)"/>
  <rect width="1200" height="120" rx="14" fill="url(#fdots)"/>

  <!-- signature line -->
  <text x="48" y="52" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="19"
        font-weight="600" letter-spacing="3.4" fill="#E6F0FB">YAMAN OBIEDAT</text>
  <text x="1152" y="52" text-anchor="end" font-family="SFMono-Regular, Menlo, Consolas, monospace"
        font-size="14" letter-spacing="2.4" fill="#7FA9D8">AMMAN, JORDAN · AR / EN</text>

  <!-- the route arrives. one 6s timeline, no begin offsets, so the
       packet lands exactly when the node fires: travel 0-80%, impact 80-90%. -->
  <line x1="48" y1="86" x2="1152" y2="86" stroke="url(#fedge)" stroke-width="2.2"/>

  <path d="M48,86 L1152,86" fill="none" stroke="#5AA6FF" stroke-width="2.6" stroke-linecap="round"
        stroke-dasharray="150 1150" stroke-dashoffset="1300" filter="url(#fgl)">
    <animate attributeName="stroke-dashoffset" values="1300;-150;-150" keyTimes="0;0.8;1"
             dur="6s" calcMode="linear" repeatCount="indefinite"/>
  </path>

  <g fill="#0A1B2E" stroke="#3B8AD9" stroke-width="1.8">
    <circle cx="330" cy="86" r="5"/><circle cx="678" cy="86" r="5"/><circle cx="960" cy="86" r="5"/>
  </g>

  <circle r="4.2" fill="#DCEBFF" filter="url(#fgl)">
    <animateMotion dur="6s" calcMode="spline" keyPoints="0;1;1" keyTimes="0;0.8;1"
                   keySplines="0.15 0.55 0.25 1;0 0 1 1"
                   path="M48,86 L1152,86" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.02;0.79;0.85;1"
             dur="6s" repeatCount="indefinite"/>
  </circle>

  <!-- terminal node -->
  <circle cx="1152" cy="86" r="6.5" fill="#1F6FEB" stroke="#BFDCFF" stroke-width="2" filter="url(#fgl)"/>
  <circle cx="1152" cy="86" r="8.5" fill="#FFFFFF" opacity="0" filter="url(#fgl)">
    <animate attributeName="opacity" values="0;0;1;0.5;0;0" keyTimes="0;0.78;0.82;0.87;0.94;1"
             dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1152" cy="86" r="6.5" fill="none" stroke="#BFDCFF" stroke-width="2.6" opacity="0">
    <animate attributeName="r" values="6.5;6.5;36;36" keyTimes="0;0.79;0.95;1"
             dur="6s" calcMode="spline" keySplines="0 0 1 1;0.1 0.7 0.3 1;0 0 1 1" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.79;0.83;0.95;1"
             dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1152" cy="86" r="6.5" fill="none" stroke="#5AA6FF" stroke-width="1.8" opacity="0">
    <animate attributeName="r" values="6.5;6.5;26;26" keyTimes="0;0.84;0.99;1"
             dur="6s" calcMode="spline" keySplines="0 0 1 1;0.1 0.7 0.3 1;0 0 1 1" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0;0.75;0;0" keyTimes="0;0.84;0.88;0.99;1"
             dur="6s" repeatCount="indefinite"/>
  </circle>
</svg>
