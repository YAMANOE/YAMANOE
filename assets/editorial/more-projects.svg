<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="410" viewBox="0 0 1000 410" role="img"><title>more-projects</title><rect width="1000" height="410" fill="#f4efe5"/><g font-family="Arial,Helvetica,sans-serif"><path d="M50 1H950" stroke="#d2c9b9"/><text x="50" y="40" font-size="12" fill="#995335">MORE PUBLIC PROJECTS</text><text x="50" y="98" font-size="40" fill="#293129" font-family="Georgia,serif">Explore more.</text><text x="50" y="157" font-size="29" fill="#293129" font-family="Georgia,serif">NextGen Recommender</text><text x="50" y="197" font-size="20" fill="#657064">Hybrid recommendations with feedback memory, saved sessions,</text><text x="50" y="227" font-size="20" fill="#657064">and explanations for why each result was selected.</text><path d="M50 257H950" stroke="#d2c9b9"/><text x="50" y="302" font-size="29" fill="#293129" font-family="Georgia,serif">Toxic Text Classification</text><text x="50" y="342" font-size="20" fill="#657064">Bidirectional LSTM and LoRA-tuned DistilBERT, compared with</text><text x="50" y="372" font-size="20" fill="#657064">published evaluation results.</text></g></svg>