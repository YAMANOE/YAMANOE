<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="345" viewBox="0 0 1000 345" role="img"><title>about</title><rect width="1000" height="345" fill="#f4efe5"/><g font-family="Arial,Helvetica,sans-serif"><path d="M50 1H950" stroke="#d2c9b9"/><text x="50" y="40" font-size="12" fill="#995335">ABOUT</text><text x="50" y="98" font-size="40" fill="#293129" font-family="Georgia,serif">Useful intelligence. Thoughtful engineering.</text><text x="50" y="149" font-size="21" fill="#657064">I build bilingual AI systems for the public sector in Jordan.</text><text x="50" y="180" font-size="21" fill="#657064">My work connects Arabic NLP, computer vision, and geospatial data,</text><text x="50" y="211" font-size="21" fill="#657064">with traceable evidence and interfaces that work in Arabic and English.</text><text x="50" y="273" font-size="12" fill="#995335">YARMOUK UNIVERSITY</text><text x="50" y="303" font-size="17" fill="#657064">B.Sc. Data Science &amp; Artificial Intelligence</text><text x="620" y="273" font-size="12" fill="#995335">HTU / 9xAI PROGRAM</text><text x="620" y="303" font-size="17" fill="#657064">AI Developer</text></g></svg>