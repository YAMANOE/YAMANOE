<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Yaman Obiedat — AI engineer</title>
  <desc id="desc">A custom YO monogram and mint orbital sculpture on charcoal. AI systems, geospatial intelligence and computer vision. Based in Amman, Jordan.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#e9ede5" stroke-opacity=".035"/></pattern>
    <radialGradient id="light"><stop stop-color="#263f35"/><stop offset="1" stop-color="#121715"/></radialGradient>
  </defs>
  <style>
    text{font-family:Arial,Helvetica,sans-serif}.orbit{transform-origin:950px 270px;animation:rotate 36s linear infinite}.signal{animation:signal 5s ease-in-out infinite}@keyframes rotate{to{transform:rotate(360deg)}}@keyframes signal{50%{opacity:.35}}@media(prefers-reduced-motion:reduce){.orbit,.signal{animation:none}}
  </style>
  <path fill="#121715" d="M0 0h1200v560H0z"/>
  <circle cx="950" cy="270" r="270" fill="url(#light)"/>
  <path fill="url(#grid)" d="M0 0h1200v560H0z"/>
  <g transform="translate(54 45)" fill="none" stroke="#b3d7b9" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M0 0l12 15L24 0M12 15v18"/><rect x="34" y="0" width="25" height="33" rx="12.5"/></g>
  <text x="132" y="66" fill="#b5bdb7" font-size="14" letter-spacing="3">YAMAN / AI ENGINEER</text>
  <text x="1146" y="66" text-anchor="end" fill="#b5bdb7" font-size="13" letter-spacing="2">AMMAN, JO</text>
  <path d="M54 106h1092" stroke="#303933"/>
  <text x="54" y="211" fill="#b3d7b9" font-size="15" letter-spacing="3">INTELLIGENCE, BUILT WITH INTENT.</text>
  <text x="49" y="301" fill="#f0f0e8" font-size="82" font-weight="700" letter-spacing="-4">Yaman</text>
  <text x="49" y="384" fill="#f0f0e8" font-size="82" font-weight="700" letter-spacing="-4">Obiedat.</text>
  <text x="54" y="433" fill="#b5bdb7" font-size="22">From real-world data to systems people can trust.</text>
  <g fill="none" stroke="#b3d7b9" stroke-width="1.2">
    <circle cx="950" cy="270" r="158" stroke-opacity=".55"/>
    <g class="orbit">
      <ellipse cx="950" cy="270" rx="158" ry="52" stroke-opacity=".75" transform="rotate(-35 950 270)"/>
      <ellipse cx="950" cy="270" rx="158" ry="100" stroke-opacity=".35" transform="rotate(-35 950 270)"/>
      <ellipse cx="950" cy="270" rx="52" ry="158" stroke-opacity=".75" transform="rotate(-35 950 270)"/>
      <ellipse cx="950" cy="270" rx="100" ry="158" stroke-opacity=".35" transform="rotate(-35 950 270)"/>
      <circle cx="1079" cy="179" r="5" fill="#b3d7b9"/>
    </g>
    <path d="M762 270h376M950 82v376" stroke-opacity=".18" stroke-dasharray="3 7"/>
    <circle class="signal" cx="950" cy="270" r="8" fill="#b3d7b9" stroke="none"/>
  </g>
  <text x="950" y="466" text-anchor="middle" fill="#b5bdb7" font-size="11" letter-spacing="3">DATA → REASONING → IMPACT</text>
  <path d="M54 495h1092" stroke="#303933"/>
  <text x="54" y="532" fill="#b5bdb7" font-size="14" letter-spacing="1">AI SYSTEMS / GEOSPATIAL / COMPUTER VISION</text>
  <text x="1146" y="532" text-anchor="end" fill="#b3d7b9" font-size="14">AR / EN</text>
</svg>
