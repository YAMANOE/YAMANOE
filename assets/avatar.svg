<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Yaman Obiedat mark: an eight-point geometric star drawn as a single routing circuit">
  <title>Yaman Obiedat — routing lattice mark</title>
  <defs>
    <radialGradient id="g" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#14365A"/>
      <stop offset="52%" stop-color="#0A1B2E"/><stop offset="100%" stop-color="#040C15"/>
    </radialGradient>
    <linearGradient id="star" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#7FBEFF"/><stop offset="50%" stop-color="#2F80F5"/><stop offset="100%" stop-color="#0A66C2"/>
    </linearGradient>
    <filter id="gl" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" fill="url(#g)"/>

  <!-- {8/3} star polygon: one continuous circuit through all eight vertices -->
  <path d="M256,86 L376.2,376.2 L86,256 L376.2,135.8 L256,426 L135.8,135.8 L426,256 L135.8,376.2 Z"
        fill="none" stroke="url(#star)" stroke-width="26" stroke-linejoin="round" stroke-linecap="round" filter="url(#gl)"/>

  <!-- vertices: solid, no ring — rings blur into noise below 48px -->
  <g fill="#CFE4FF">
    <circle cx="256" cy="86" r="13"/><circle cx="376.2" cy="135.8" r="13"/>
    <circle cx="426" cy="256" r="13"/><circle cx="376.2" cy="376.2" r="13"/>
    <circle cx="256" cy="426" r="13"/><circle cx="135.8" cy="376.2" r="13"/>
    <circle cx="86" cy="256" r="13"/><circle cx="135.8" cy="135.8" r="13"/>
  </g>

  <circle cx="256" cy="256" r="40" fill="#071626"/>
  <circle cx="256" cy="256" r="27" fill="#7FBEFF" filter="url(#gl)"/>
</svg>
